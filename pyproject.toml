[project]
name = "redi-a26-lesson5"
version = "0.1.0"
description = "ReDI Café Checkout testing exercise"
requires-python = ">=3.9"
dependencies = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v"
